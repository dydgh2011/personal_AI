
services:
  claude-worker:
    build:
      context: .
      dockerfile: images/coding-worker/Dockerfile
    restart: unless-stopped
    init: true
    volumes:
      - ./data/claude-home:/home/node          # Claude subscription login + worker state (.agent-worker/)
      - ./workspaces/claude:/workspace         # projects (sandbox/) and per-task worktrees (.worktrees/)
      # Only the repositories Claude may use (repo-sync export, read-only). Codex has its own volume.
      - repo-export-claude:/repo-cache:ro
      # Git bundles of task commits for the GitHub Publisher (read-only there). Only this worker writes it.
      - publisher-artifacts-claude:/artifacts
    # Polling client: claims claude tasks from the controller and runs Claude Code on them.
    # `docker compose exec claude-worker claude ...` still works for manual use.
    command: ["node", "/opt/agent-worker/main.js"]
    env_file:
      - ./secrets/claude-worker.controller.env   # CONTROLLER_URL + this worker's token only
    environment:
      WORKER_AGENT: claude
      # Projects, write permission and GitHub cache state come from the controller's registry
      # (GET /internal/projects) for every task. WORKER_PROJECTS / WORKER_WRITABLE_PROJECTS would
      # only add restrictions on top of it.
      WORKER_REPO_CACHE: /repo-cache
      WORKER_ARTIFACT_DIR: /artifacts
      WORKER_POLL_INTERVAL_SECONDS: "5"
      WORKER_HEARTBEAT_SECONDS: "10"           # also how quickly a cancel request is noticed
      WORKER_TASK_TIMEOUT_SECONDS: "1800"
    stop_grace_period: 30s                     # time to stop the CLI and report before SIGKILL
    healthcheck:
      # The worker refreshes its lock file every 20s while its event loop is alive.
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/home/node/.agent-worker/worker.lock').mtimeMs<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  codex-worker:
    build:
      context: .
      dockerfile: images/coding-worker/Dockerfile
    restart: unless-stopped
    init: true
    volumes:
      - ./data/codex-home:/home/node          # ChatGPT login (.codex/) + worker state (.agent-worker/)
      - ./workspaces/codex:/workspace         # projects (sandbox/) and per-task worktrees (.worktrees/)
      # Only the repositories Codex may use (repo-sync export, read-only). Claude has its own volume.
      - repo-export-codex:/repo-cache:ro
      # Git bundles of task commits for the GitHub Publisher (read-only there). Only this worker writes it.
      - publisher-artifacts-codex:/artifacts
    tmpfs:
      # Codex's per-run helper links need flock(), which the Windows bind mount lacks
      # ("failed to clean up stale arg0 temp dirs"). Only throwaway files live here.
      - /home/node/.codex/tmp:uid=1000,gid=1000,mode=0700,size=16m
    # Polling client: claims codex tasks from the controller and runs `codex exec` on them.
    # `docker compose exec codex-worker codex ...` still works for manual use.
    command: ["node", "/opt/agent-worker/main.js"]
    env_file:
      - ./secrets/codex-worker.controller.env   # CONTROLLER_URL + this worker's token only
    environment:
      WORKER_AGENT: codex
      # Projects, write permission and GitHub cache state come from the controller's registry
      # (GET /internal/projects) for every task. WORKER_PROJECTS / WORKER_WRITABLE_PROJECTS would
      # only add restrictions on top of it.
      WORKER_REPO_CACHE: /repo-cache
      WORKER_ARTIFACT_DIR: /artifacts
      WORKER_POLL_INTERVAL_SECONDS: "5"
      WORKER_HEARTBEAT_SECONDS: "10"           # also how quickly a cancel request is noticed
      WORKER_TASK_TIMEOUT_SECONDS: "1800"
      WORKER_MAX_OUTPUT_BYTES: "8388608"       # JSONL includes command output; head and tail are kept
    stop_grace_period: 30s                     # time to stop the CLI and report before SIGKILL
    healthcheck:
      # The worker refreshes its lock file every 20s while its event loop is alive.
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/home/node/.agent-worker/worker.lock').mtimeMs<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus the syscalls bubblewrap needs for unprivileged user
      # namespaces, so Codex can sandbox model-generated commands. No capabilities are added.
      # See images/coding-worker/seccomp/build-codex-profile.mjs.
      - seccomp=./images/coding-worker/seccomp/codex-worker.json
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Per-agent exports written by repo-sync (compose.controller.yaml); the full cache is not mounted here.
  repo-export-claude:
  repo-export-codex:
  # Per-agent publisher artifacts (compose.publisher.yaml mounts both read-only).
  publisher-artifacts-claude:
  publisher-artifacts-codex:
