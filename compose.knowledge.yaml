# Knowledge store: everything about the owner, in four layers (raw originals, activity timeline,
# wiki pages with sourced facts and links, profile), with keyword + semantic search.
# Needs compose.controller.yaml (hermes-broker) and compose.yaml (hermes: chat turns, attachments).
#   node services/knowledge/scripts/init-secrets.mjs      (keys; never prints them)
#   secrets/knowledge-dashboard.key (same script) is optional: while it is missing, Compose only warns
#   ("secret file ... does not exist") and the knowledge service starts without the dashboard client.
#   docker compose @F up -d --build --no-deps knowledge hermes-broker
#
# - Hermes reaches it only through hermes-broker (fixed /knowledge/* routes, key held by the broker).
#   No host port.
# - Reads Hermes's chat attachment folder read-only, to keep a copy of each attached original.
# - Originals (possibly 20 GB+) live in data/knowledge/blobs on this drive; the database in the
#   knowledge-data volume (Docker Desktop: Settings > Resources > Advanced > Disk image location on D:).
# - The Dashboard graph page reaches it over knowledge-dashboard (internal, nothing else on it) with its
#   own key (client "dashboard"): read the graph/pages/facts, edit facts, pages and links (archive, never
#   delete). No raw originals, search, purge, imports or operator routes. The dashboard service joins
#   knowledge-dashboard in its own compose file (see services/knowledge/README.md, "Dashboard client").
# - Bulk import and Claude Code access: compose.knowledge-operator.yaml (add it only while needed).
# - knowledge-egress: Ollama on this PC (host.docker.internal:11434, bge-m3 embeddings). Without
#   Ollama the store works with keyword search only.

services:
  knowledge:
    build:
      context: ./services/knowledge
    image: personal_ai-knowledge:local
    restart: unless-stopped
    init: true
    environment:
      TZ: America/Toronto
      KNOWLEDGE_TIME_ZONE: America/Toronto
      KNOWLEDGE_CLIENTS: hermes-broker=/run/secrets/broker_key
      KNOWLEDGE_CLIENTS_DASHBOARD: dashboard?=/run/secrets/dashboard_key   # ? = optional: no key file yet -> no dashboard access, service still starts
      KNOWLEDGE_DB_FILE: /var/lib/knowledge/knowledge.db
      KNOWLEDGE_BLOB_DIR: /var/lib/knowledge-blobs
      KNOWLEDGE_DOCUMENTS_DIR: /imports/hermes-documents
      KNOWLEDGE_IMAGES_DIR: /imports/hermes-images
      KNOWLEDGE_AUDIO_DIR: /imports/hermes-audio
      KNOWLEDGE_NIGHTLY_AT: "00:15"
      KNOWLEDGE_MEDIA_SOCKET: /run/knowledge-media/worker.sock
      OLLAMA_URL: http://host.docker.internal:11434
      EMBED_MODEL: bge-m3
    secrets:
      - source: knowledge_broker_key
        target: broker_key
      - source: knowledge_dashboard_key
        target: dashboard_key
    volumes:
      - knowledge-data:/var/lib/knowledge                                 # knowledge.db (Docker disk; keep Docker's disk image on D:)
      - ./data/knowledge/blobs:/var/lib/knowledge-blobs                   # stored originals, <sha256>.<ext>, on D:
      - ./data/hermes/cache/documents:/imports/hermes-documents:ro        # chat attachments only (no Hermes secrets)
      - ./data/hermes/cache/images:/imports/hermes-images:ro
      - ./data/hermes/cache/audio:/imports/hermes-audio:ro
      - knowledge-media-ipc:/run/knowledge-media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - knowledge-internal
      - knowledge-egress
      - knowledge-dashboard
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Local media processing uses an isolated Unix socket and a read-only view of stored originals.
  knowledge-media:
    build:
      context: ./services/knowledge-media
    image: personal_ai-knowledge-media:local
    restart: unless-stopped
    init: true
    network_mode: none
    volumes:
      - knowledge-media-ipc:/run/knowledge-media
      - ./data/knowledge/blobs:/blobs:ro
      - ./data/knowledge/models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "worker.py", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Overlay: Hermes loads the knowledge store as its memory provider (data/hermes/config.yaml:
  # memory.provider: personal-ai-knowledge). Read-only from the repository.
  hermes:
    volumes:
      - ./services/hermes-integration/plugins/personal-ai-knowledge:/opt/data/plugins/personal-ai-knowledge:ro

  # Overlay: the broker forwards Hermes' /knowledge/* calls to the knowledge store.
  hermes-broker:
    environment:
      KNOWLEDGE_URL: http://knowledge:8092
      KNOWLEDGE_KEY_FILE: /run/secrets/knowledge_key
      BROKER_KNOWLEDGE_WRITES_PER_MINUTE: "120"
    secrets:
      - source: knowledge_broker_key
        target: knowledge_key
    networks:
      - knowledge-internal

  # Overlay: the dashboard's "Knowledge" graph page (client "dashboard": read the graph, edit facts,
  # pages and links; never raw originals, search, purge or operator routes). knowledge-dashboard is
  # internal and has only these two services on it.
  dashboard:
    environment:
      KNOWLEDGE_URL: http://knowledge:8092
      KNOWLEDGE_KEY_FILE: /run/secrets/knowledge_key
    secrets:
      - source: knowledge_dashboard_key
        target: knowledge_key
    networks:
      - knowledge-dashboard

volumes:
  knowledge-data:
  knowledge-media-ipc:

networks:
  knowledge-internal:
    driver: bridge
    internal: true
  knowledge-egress:
    driver: bridge
  # Dashboard <-> knowledge only (the graph page). internal: no way out to the internet.
  knowledge-dashboard:
    driver: bridge
    internal: true

secrets:
  knowledge_broker_key:
    file: ./secrets/knowledge-broker.key        # services/knowledge/scripts/init-secrets.mjs
  knowledge_dashboard_key:
    file: ./secrets/knowledge-dashboard.key     # services/knowledge/scripts/init-secrets.mjs (client "dashboard")
