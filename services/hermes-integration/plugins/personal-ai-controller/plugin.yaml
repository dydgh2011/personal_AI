name: personal-ai-controller
version: 0.5.0
description: "Personal AI OS: delegate coding tasks to the Claude/Codex Docker workers through the task controller (via hermes-broker), and block tool calls that would bypass it."
author: "dydgh2011, Hermes Agent"
kind: standalone
platforms:
  - linux
provides_tools:
  - personal_ai_task
  - personal_ai_worker_login
  - personal_ai_planner
  - personal_ai_document
  - personal_ai_school
  - personal_ai_learning
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - post_tool_call
  - transform_llm_output
